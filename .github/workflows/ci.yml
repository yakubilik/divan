name: CI

# Three parts that have to agree with each other, checked on every push. The
# daemon jobs run the ends of the supported Python range rather than the middle,
# because the middle is what everybody develops on and the ends are where it
# breaks.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: daemon · py${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v4
      # The matrix python, actually installed: without this the jobs all ran on
      # whichever python the runner image ships, and once that python started
      # calling itself externally managed, uv refused to install into it at all.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv pip install --system -e daemon
      - name: Import
        # The same check the updater runs before it lets a pulled commit
        # restart a daemon: a syntax error here is one a supervisor would
        # otherwise discover by restarting forever.
        run: python -c "import remote_ai_chat, remote_ai_chat.server"
      - name: Tests
        working-directory: daemon
        # Every script that spends no model turns and touches no network.
        # scripts/e2e.py and scripts/smoke.py need a running daemon and a real
        # sign-in, so they stay a human's job.
        run: |
          for t in test_pool test_preamble test_replay test_session test_stream test_fanout test_attachments test_agents test_titles test_push test_ustabasi test_ustabasi_run test_divan test_model_catalog test_dictation test_filing; do
            echo "── $t"
            python "scripts/$t.py"
          done

  app:
    name: app · typecheck and judgements
    runs-on: ubuntu-latest
    # The phone app was the one part of this repository nothing checked, and it
    # is the part that cannot be run headless. What can be: the compiler, and
    # the handful of pure judgements the screens are built on — which screen a
    # notification opens, which tickets sort to the top of the ustabasi wall,
    # and whether every word those screens show is in the i18n table.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --legacy-peer-deps
        working-directory: app
      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: app
      - name: Judgements
        working-directory: app
        run: |
          node scripts/test-login-web.cjs
          node scripts/test-ustabasi.cjs

  audit:
    name: nothing private, nothing not-English
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The scanner finds what it claims to
        # A scan that reports "none" is worth nothing unless it would have said
        # something else, so the rules are fired against samples first.
        run: python scripts/test_audit.py
      - name: Scan the tracked files
        # Tracked files only. History is reported by `--history` and remedied by
        # a person; see docs/audit/.
        run: python scripts/audit.py
      - name: Every string the app asks for is in the app's string table
        # `t(key)` falls back to the key itself, so a renamed key shows a user
        # the name of a variable. The `app` job's `tsc` catches it too, and this
        # catches the ones it cannot see — a key built out of a variable, and a
        # string the app asks for in a file `tsc` is not looking at. It needs
        # nothing installed, so it runs here rather than behind an npm install.
        run: python scripts/test_i18n_keys.py

  docs:
    name: docs · links
    runs-on: ubuntu-latest
    # A dead docs/screenshots/*.png is invisible until it renders as a broken
    # image on the front page of the project, which is where most people
    # arrive. The self-test runs first: a checker nobody has seen fail is a
    # green tick that means nothing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 scripts/test_check_links.py
      - run: python3 scripts/check-links.py

  web:
    name: web panel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Typecheck and build
        # `npm run build` is `tsc --noEmit && vite build`, so this is both.
        run: npm run build
        working-directory: web
      - name: The wall's figures, and a ticket as a conversation
        # What a card says about a ticket — which column it is in, how long it
        # has been open, how long this round has been going, what is on its
        # branch — and the run of messages a ticket opens as, are both a pure
        # function of the ticket, so both are checked without a browser. Only
        # the layout needs one, and that is `npm run test:ui`, which is not in
        # CI. See web/scripts/test-ustabasi.mjs.
        run: npm test
        working-directory: web
      - name: The build carries no pairing token
        # public/dev-host.json is a real token and vite copies public/ into the
        # build; the daemon then serves that build with no auth of its own.
        # vite.config.ts strips it. This is the check that it still does.
        run: |
          if [ -e ../daemon/remote_ai_chat/webui/dev-host.json ]; then
            echo "dev-host.json shipped in the panel build" >&2
            exit 1
          fi
      - name: The build says which commit it came from
        run: test -s ../daemon/remote_ai_chat/webui/build.json
