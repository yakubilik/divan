<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Office</title>
<style>
  @font-face { font-family: 'Fusion Pixel 8px'; src: url(fusion-pixel-8px.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; height: 100%; background: #1b1a24; overflow: hidden; -webkit-user-select: none; user-select: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #labels { position: absolute; inset: 0; pointer-events: none; font-family: 'Fusion Pixel 8px', ui-monospace, monospace; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-size: 8px; border: 1px solid transparent; padding: 2px; }
  #board { position: absolute; display: flex; flex-direction: column; justify-content: center; gap: 1px; overflow: hidden;
           font-family: 'Fusion Pixel 8px', ui-monospace, monospace; font-size: 8px; line-height: 1; white-space: nowrap; padding: 0 3px; box-sizing: border-box; }
  #note { position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom)); text-align: center;
          font: 13px -apple-system, system-ui, sans-serif; color: #b9b4cc; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"><div id="wrap"><canvas id="office"></canvas><div id="board"></div><div id="labels"></div></div></div>
<div id="note"></div>
<script type="module" src="office.js"></script>
</body>
</html>
