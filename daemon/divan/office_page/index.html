<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Office</title>
<style>
  @font-face { font-family: 'Fusion Pixel 8px'; src: url(fusion-pixel-8px.woff2) format('woff2'); font-display: block; }
  html, body { margin: 0; min-height: 100%; background: #16151d; color: #d9d4ec; -webkit-user-select: none; user-select: none; }
  body { font: 13px -apple-system, system-ui, sans-serif; }
  #rooms { display: flex; flex-wrap: wrap; gap: 14px; padding: 14px; align-items: flex-start; justify-content: center; }
  .room { background: #1f1d29; border: 1px solid #2e2b3d; border-radius: 10px; overflow: hidden; }
  .room h2 { margin: 0; padding: 8px 12px; font: 600 13px -apple-system, system-ui, sans-serif; color: #e8e3fa;
             display: flex; justify-content: space-between; gap: 12px; }
  .room h2 span { color: #8f89a8; font-weight: 400; }
  .wrap { position: relative; cursor: pointer; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; font-family: 'Fusion Pixel 8px', ui-monospace, monospace; }
  .lb { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1; font-size: 8px; padding: 2px 3px;
        max-width: 96px; overflow: hidden; text-overflow: ellipsis; }
  #zoom { position: fixed; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 6px; z-index: 5; }
  #zoom button { width: 36px; height: 36px; border-radius: 18px; border: 1px solid #3a3650; background: #262335ee;
                 color: #e8e3fa; font: 600 18px -apple-system, system-ui, sans-serif; cursor: pointer; }
  #note { text-align: center; color: #8f89a8; padding: 30px; }
</style>
</head>
<body>
<div id="rooms"></div>
<div id="note"></div>
<div id="zoom"><button id="zout" aria-label="Zoom out">−</button><button id="zin" aria-label="Zoom in">+</button></div>
<script type="module" src="office.js?v=1795470334"></script>
</body>
</html>
