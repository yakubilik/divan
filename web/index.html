<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Both themes are first-class, so the shell picks neither: it follows the
         computer until the panel writes `data-theme` on <html> (src/lib/theme.ts),
         and it says so in system colours rather than in a colour of its own —
         the palette lives in one file and this is not it. -->
    <meta name="color-scheme" content="light dark" />
    <title>Remote AI Chat</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: Canvas; }
      body {
        font-family: -apple-system, "SF Pro Text", system-ui, "Segoe UI", sans-serif;
        color: CanvasText;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button { font: inherit; color: inherit; }
      input, textarea { font: inherit; color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
