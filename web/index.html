<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Both themes are first-class, so the shell picks neither: it follows the
         computer until the panel writes `data-theme` on <html> (src/lib/theme.ts),
         and it says so in system colours rather than in a colour of its own —
         the palette lives in one file and this is not it. -->
    <meta name="color-scheme" content="light dark" />
    <!-- One mark, one file: the tab, the bookmark and the home-screen icon are
         the same geometry the top bar draws, and it carries both inks so the
         browser's own scheme picks one. -->
    <link rel="icon" type="image/svg+xml" href="/divan.svg" />
    <link rel="apple-touch-icon" href="/divan.svg" />
    <title>Divan</title>
    <style>
      html, body, #root { height: 100%; margin: 0; background: Canvas; }
      body {
        font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
        color: CanvasText;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      button { font: inherit; color: inherit; }
      input, textarea { font: inherit; color: inherit; }
    </style>
  </head>
  <body>
    <!-- What stands here until the bundle runs, and what is left if it never
         does: a script that 404s or fails to parse used to leave the page black
         and silent. React replaces this on its first paint. -->
    <div id="root" class="dv-root dv-ambient" data-theme="dark">
      <div id="boot" style="position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:40px 32px;font:400 14px/1.5 -apple-system,system-ui,sans-serif">
        <div style="font-size:24px;font-weight:600;letter-spacing:-.02em">Divan</div>
        <div style="opacity:.7">Loading the panel…</div>
        <div style="opacity:.55;font-size:13px">If this stays, the browser is holding an old copy of the page: reload it while holding Shift, or open it in a private window.</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
